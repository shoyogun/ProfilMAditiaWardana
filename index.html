<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil Saya</title>
  <!-- Google Fonts & Font Awesome untuk ikon -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .profile-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease;
    }

    .profile-card:hover {
      transform: translateY(-5px);
    }

    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover; /* Penting agar foto tidak gepeng */
      border: 4px solid #38bdf8;
    }

    .status-badge {
      position: absolute;
      bottom: 5px;
      right: 5px;
      width: 18px;
      height: 18px;
      background-color: #22c55e;
      border: 3px solid #1e293b;
      border-radius: 50%;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .title {
      color: #38bdf8;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .bio {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .skill-tag {
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .social-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .social-icon:hover {
      background: #38bdf8;
      color: #0f172a;
      transform: scale(1.1);
    }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 14px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
      transition: opacity 0.2s ease;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <div class="avatar-wrapper">
      <!-- FOTO ANDA DITAMBAHKAN DI SINI -->
      <img src="1003351787.jpg" alt="Foto Profil" id="profile-img" />
      <span class="status-badge" title="Online"></span>
    </div>

    <h1>M Aditia Wardana</h1>
    <p class="title">UI/UX Designer & Gamer</p>
    
    <p class="bio">
      Fokus membangun desain visual yang estetik dan pengalaman pengguna yang responsif.
    </p>

    <div class="skills">
      <span class="skill-tag">Branding</span>
      <span class="skill-tag">Blajari dari Ai</span>
      <span class="skill-tag">Graphic Design</span>
    </div>

    <div class="social-links">

    </div>

</body>
</html>
